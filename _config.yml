title: "Helmy — Technical Blog"
description: "Notes on web development, .NET, Angular, and everything in between."
author: Helmy

# User site served from https://7elmy.github.io/
url: "https://7elmy.github.io"
baseurl: ""

theme: minima
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title:output_ext

# Include posts whose date is a few hours ahead of the Pages build clock —
# without this, a post dated later on the build day silently disappears.
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/folders that should not be copied into _site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .vs
  - .claude
  - README.md
  - CLAUDE.md
